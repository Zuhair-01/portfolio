<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alwazour technical content system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a16"/>
      <stop offset="1" stop-color="#0c1024"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- left: rejected slide (flat, text-only) -->
  <g transform="translate(96,46)">
    <rect width="128" height="150" rx="10" fill="#12172e" stroke="#232c4e"/>
    <line x1="20" y1="34" x2="108" y2="34" stroke="#3a4468" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="54" x2="88" y2="54" stroke="#2c3557" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="86" x2="108" y2="86" stroke="#2c3557" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="104" x2="108" y2="104" stroke="#2c3557" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="122" x2="72" y2="122" stroke="#2c3557" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="182" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#e0533a" letter-spacing="1">REJECTED</text>
  </g>

  <!-- arrow -->
  <g transform="translate(250,121)" stroke="url(#acc)" stroke-width="2" fill="none">
    <line x1="0" y1="0" x2="360" y2="0" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <path d="M352 -7 L366 0 L352 7"/>
  </g>
  <text x="430" y="112" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10.5" fill="#9aa3bd" letter-spacing="2">DIAGNOSE · SYSTEMATISE · REBUILD</text>

  <!-- right: rebuilt slide (object + structure) -->
  <g transform="translate(636,40)">
    <rect width="150" height="164" rx="11" fill="#0f1530" stroke="url(#acc)" stroke-opacity="0.55"/>
    <!-- product blob -->
    <rect x="18" y="86" width="58" height="34" rx="6" fill="#26304f"/>
    <rect x="82" y="94" width="46" height="20" rx="4" fill="#1c2544"/>
    <!-- callout lines -->
    <line x1="76" y1="94" x2="120" y2="72" stroke="#4f7cff" stroke-width="1.4"/>
    <circle cx="120" cy="72" r="3" fill="#4f7cff"/>
    <line x1="18" y1="34" x2="128" y2="34" stroke="#7aa2ff" stroke-width="5" stroke-linecap="round"/>
    <!-- measurement ruler -->
    <line x1="18" y1="140" x2="128" y2="140" stroke="#3a4468" stroke-width="2"/>
    <line x1="30" y1="136" x2="30" y2="144" stroke="#4f7cff" stroke-width="2"/>
    <line x1="66" y1="136" x2="66" y2="144" stroke="#4f7cff" stroke-width="2"/>
    <line x1="116" y1="136" x2="116" y2="144" stroke="#4f7cff" stroke-width="2"/>
    <text x="75" y="200" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#3ddc97" letter-spacing="1">SYSTEM</text>
  </g>
</svg>
