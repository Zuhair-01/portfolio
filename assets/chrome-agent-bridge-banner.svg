<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="chrome-agent-bridge">
  <defs>
    <linearGradient id="cabbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <pattern id="cabgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#cabbg)"/>
  <rect width="1200" height="300" fill="url(#cabgrid)"/>

  <!-- DevTools-style browser panel emitting a raw CDP frame -->
  <g transform="translate(60,66)">
    <rect width="330" height="168" rx="9" fill="#0f1620" stroke="#30363d" stroke-width="1.2"/>
    <rect width="330" height="30" rx="9" fill="#151d28"/>
    <rect width="330" height="14" y="16" fill="#151d28"/>
    <circle cx="17" cy="15" r="4" fill="#ff5f57" opacity="0.85"/>
    <circle cx="33" cy="15" r="4" fill="#febc2e" opacity="0.85"/>
    <circle cx="49" cy="15" r="4" fill="#28c840" opacity="0.85"/>
    <text x="70" y="19" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" fill="#8b949e">DevTools Protocol</text>

    <text x="18" y="56" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#58a6ff">&#8594; Page.navigate</text>
    <text x="18" y="76" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" fill="#6e7681">{"url":"https://app"}</text>
    <text x="18" y="102" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#3fb950">&#8592; frameNavigated</text>
    <text x="18" y="122" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" fill="#6e7681">{"frameId":"F19A2"}</text>
    <text x="18" y="148" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#58a6ff">&#8594; Runtime.evaluate</text>
  </g>

  <!-- raw wire out to three agent CLIs -->
  <g stroke="#30363d" stroke-width="1.4" fill="none">
    <path d="M390 150 C 460 150 460 96 540 96"/>
    <path d="M390 150 H 540"/>
    <path d="M390 150 C 460 150 460 204 540 204"/>
  </g>
  <g fill="#58a6ff">
    <circle r="3.2" cy="96"><animateMotion dur="2.6s" repeatCount="indefinite" path="M-150 0 C -80 0 -80 -54 0 -54"/></circle>
    <circle r="3.2" cy="150"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M-150 0 H 0"/></circle>
    <circle r="3.2" cy="204"><animateMotion dur="2.6s" begin="1s" repeatCount="indefinite" path="M-150 0 C -80 0 -80 54 0 54"/></circle>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12.5">
    <rect x="540" y="80" width="86" height="32" rx="6" fill="#0f1620" stroke="#30363d"/>
    <text x="583" y="100" fill="#e6edf3" text-anchor="middle">claude</text>
    <rect x="540" y="134" width="86" height="32" rx="6" fill="#0f1620" stroke="#30363d"/>
    <text x="583" y="154" fill="#e6edf3" text-anchor="middle">opencode</text>
    <rect x="540" y="188" width="86" height="32" rx="6" fill="#0f1620" stroke="#30363d"/>
    <text x="583" y="208" fill="#e6edf3" text-anchor="middle">codex</text>
  </g>

  <text x="668" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">chrome-agent-bridge</text>
  <text x="670" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b949e">Raw CDP control for any AI agent, zero extensions</text>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" fill="#586069">
    <text x="670" y="182">watchdog-bounded verbs</text>
    <text x="670" y="200">OpenCode &#183; Codex &#183; Claude ready</text>
  </g>
</svg>
